name: mcpscan
description: Static security scan of an MCP tool manifest or client config, with optional SARIF upload to code scanning.
author: pallashiv
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Path to the tool manifest or client config JSON file, relative to the workspace.
    required: true
  fail-on:
    description: Fail the job if any finding is at or above this severity (low, medium, high, critical).
    default: low
  baseline:
    description: Baseline file (from `mcpscan scan --write-baseline`). Only findings not in it can fail the job.
    default: ""
  ignore-file:
    description: JSON ignore file. Each entry needs a rule ID and a reason.
    default: ""
  sarif-file:
    description: Where to write the SARIF report.
    default: mcpscan.sarif
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning. The job needs the `security-events: write` permission."
    default: "false"
  python-version:
    description: Python version used to run mcpscan.
    default: "3.12"

outputs:
  exit-code:
    description: "mcpscan exit code: 0 clean or below threshold, 1 findings at or above fail-on, 2 usage or parse error."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcpscan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MCPSCAN_PATH: ${{ inputs.path }}
        MCPSCAN_FAIL_ON: ${{ inputs.fail-on }}
        MCPSCAN_BASELINE: ${{ inputs.baseline }}
        MCPSCAN_IGNORE_FILE: ${{ inputs.ignore-file }}
        MCPSCAN_SARIF_FILE: ${{ inputs.sarif-file }}
      run: bash "$ACTION_PATH/scripts/run-scan.sh"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: mcpscan

    - name: Fail on findings
      if: steps.scan.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        if [ "$CODE" = "2" ]; then
          echo "::error::mcpscan could not scan the input (see the report above)"
        else
          echo "::error::mcpscan found issues at or above the fail-on threshold"
        fi
        exit "$CODE"
