name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke-test the CLI
        run: |
          mcpscan scan examples/safe_manifest.json
          mcpscan scan examples/vulnerable_manifest.json --format sarif --output /dev/null --fail-on critical || test $? -eq 1
