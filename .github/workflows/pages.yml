name: Deploy demo site

# Builds site/examples/ fresh from the current code on every push to main, so the live demo
# can never show stale output, then publishes site/ to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/mcpscan/**"
      - "examples/**"
      - "tests/fixtures/real/**"
      - "scripts/build_demo_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/build_demo_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
